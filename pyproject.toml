[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loggerpi-otterpi"
version = "1.0.0"
description = "LoggerPi-OtterPi"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "src/loggerpi_otterpi",
    "src/loggerpi_otterpi/model",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "docs/legacy",
    "docs/development/DEVELOPMENT-QUALITY.md",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "FA102",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
